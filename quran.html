<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
function L(a,b){return window.__nyalaLang==='en'?b:a;}
function toast(msg){var box=$('toasts');if(!box)return;var t=document.createElement('div');t.className='toast';t.textContent=msg;box.appendChild(t);while(box.children.length>3)box.removeChild(box.firstChild);setTimeout(function(){t.classList.add('go');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},320);},3400);}
var COUNTS=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
var OFFSET=[];(function(){var s=0;for(var i=0;i<COUNTS.length;i++){OFFSET.push(s);s+=COUNTS[i];}})();
var TOTAL=OFFSET[113]+COUNTS[113];
var RECITERS=[
{id:'ar.alafasy',name:'Mishary Rashid Alafasy'},
{id:'ar.husary',name:'Mahmoud Khalil Al-Husary'},
{id:'ar.abdurrahmaansudais',name:'Abdurrahman As-Sudais'},
{id:'ar.abdulbasitmujawwad',name:'Abdul Basit (Mujawwad)'},
{id:'ar.minshawi',name:'Mohamed Siddiq El-Minshawi'}
];
var HKEY='nyala_hafalan_v1',QKEY='nyala_qari',LKEY='nyala_quran_last';
var haf={};try{haf=JSON.parse(localStorage.getItem(HKEY)||'{}')||{};}catch(e){haf={};}
function saveHaf(){try{localStorage.setItem(HKEY,JSON.stringify(haf));}catch(e){}}
var reciter=RECITERS[0].id;try{var r0=localStorage.getItem(QKEY);if(r0)reciter=r0;}catch(e){}
var SURAH=null,curSurah=0,curAyah=0,playing=false,queue=[],fullMode=false,autoNext=true,showTrans=true,showLatin=false;
var enCache=null,enTried=false,latinCache=null,latinTried=false,undoBuf=null;
var audio=new Audio();audio.preload='none';

function norm(obj){
  var out=[];
  function push(num,name,ename,etran,ayahs){out.push({number:num,name:name||'',ename:ename||'',etran:etran||'',ayahs:ayahs});}
  if(obj&&obj.data&&Array.isArray(obj.data.surahs)){obj.data.surahs.forEach(function(s){push(s.number,s.name,s.englishName,s.englishNameTranslation,(s.ayahs||[]).map(function(a){return{n:a.numberInSurah,text:a.text};}));});}
  else if(obj&&Array.isArray(obj.surahs)){obj.surahs.forEach(function(s){push(s.number,s.name,s.englishName,s.englishNameTranslation,(s.ayahs||[]).map(function(a){return{n:a.numberInSurah,text:a.text};}));});}
  else if(Array.isArray(obj)){
    if(obj.length&&obj[0]&&Array.isArray(obj[0].ayahs)){obj.forEach(function(s){push(s.number,s.name,s.englishName,s.englishNameTranslation,(s.ayahs||[]).map(function(a){return{n:a.numberInSurah,text:a.text};}));});}
    else{var m={};obj.forEach(function(r){var sn=r.surah||r.sura||r.chapter,an=r.aya||r.ayah||r.verse;if(!m[sn])m[sn]=[];m[sn].push({n:an,text:r.text});});Object.keys(m).sort(function(a,b){return a-b;}).forEach(function(k){push(+k,'','','',m[k]);});}
  }
  else if(obj&&obj.quran&&Array.isArray(obj.quran)){return norm(obj.quran);}
  out.sort(function(a,b){return a.number-b.number;});
  return out;
}
function fetchJSON(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function loadAll(){
  var arP=fetchJSON('quran-uthmani.json').catch(function(){return fetchJSON('https://api.alquran.cloud/v1/quran/quran-uthmani');});
  var idP=fetchJSON('id.indonesian.json').catch(function(){return fetchJSON('https://api.alquran.cloud/v1/quran/id.indonesian');});
  return Promise.all([arP,idP]).then(function(res){
    var ar=norm(res[0]),id=norm(res[1]);
    var idMap={};id.forEach(function(s){idMap[s.number]={tr:{},nm:'',nmEn:''};s.ayahs.forEach(function(a){idMap[s.number].tr[a.n]=a.text;});idMap[s.number].nm=s.etran||s.ename;idMap[s.number].nmEn=s.ename;});
    ar.forEach(function(s){
      var rec=idMap[s.number]||{tr:{},nm:s.ename,nmEn:s.ename};
      s.nameId=rec.nm||s.ename;s.nameEn=rec.nmEn||s.ename;
      s.ayahs.forEach(function(a){a.id=rec.tr[a.n]||'';});
    });
    return ar;
  });
}
function loadEN(){
  if(enCache)return Promise.resolve(enCache);
  if(enTried)return Promise.resolve(enCache);
  enTried=true;
  return fetchJSON('en.sahih.json').catch(function(){return fetchJSON('https://api.alquran.cloud/v1/quran/en.sahih');}).then(function(o){
    var m={};norm(o).forEach(function(s){m[s.number]={};s.ayahs.forEach(function(a){m[s.number][a.n]=a.text;});});
    enCache=m;return m;
  }).catch(function(){enCache=null;return null;});
}
function loadLatin(){
  if(latinCache)return Promise.resolve(latinCache);
  if(latinTried)return Promise.resolve(latinCache);
  latinTried=true;
  return fetchJSON('https://api.alquran.cloud/v1/quran/en.transliteration').then(function(o){
    var m={};norm(o).forEach(function(s){m[s.number]={};s.ayahs.forEach(function(a){m[s.number][a.n]=a.text;});});
    latinCache=m;return m;
  }).catch(function(){latinCache=null;return null;});
}
function hafCount(sn){return Object.keys(haf[sn]||{}).length;}
function hafTotal(){var n=0;for(var s in haf)n+=Object.keys(haf[s]).length;return n;}
function isHaf(sn,an){return !!(haf[sn]&&haf[sn][an]);}
function setHaf(sn,an,v){if(!haf[sn])haf[sn]={};if(v)haf[sn][an]=1;else delete haf[sn][an];saveHaf();}
function chip(){$('qHafChip').textContent='🕌 '+hafTotal()+' / '+TOTAL;}
function gNum(sn,an){return OFFSET[sn-1]+an;}

function renderList(){
  var box=$('qList');if(!box||!SURAH)return;
  var q=($('qSearch').value||'').toLowerCase().trim(),f=$('qFilter').value,sort=$('qSort').value;
  var rows=SURAH.filter(function(s){
    if(q&&!(String(s.number).indexOf(q)>-1||(s.nameEn||'').toLowerCase().indexOf(q)>-1||(s.nameId||'').toLowerCase().indexOf(q)>-1))return false;
    var full=hafCount(s.number)>=COUNTS[s.number-1];
    if(f==='done'&&!full)return false;
    if(f==='todo'&&full)return false;
    return true;
  });
  if(sort==='name')rows.sort(function(a,b){return (a.nameEn||'').localeCompare(b.nameEn||'');});
  else if(sort==='haf')rows.sort(function(a,b){return (hafCount(b.number)/COUNTS[b.number-1])-(hafCount(a.number)/COUNTS[a.number-1]);});
  box.innerHTML='';
  rows.forEach(function(s){
    var card=document.createElement('div');card.className='card q-card';card.setAttribute('role','button');card.tabIndex=0;
    var num=document.createElement('span');num.className='q-num';num.textContent=s.number;
    var names=document.createElement('span');names.className='q-names';
    var b=document.createElement('b');b.textContent=L(s.nameId||s.nameEn,s.nameEn||s.nameId);
    var sm=document.createElement('small');sm.textContent=L(COUNTS[s.number-1]+' ayat · '+hafCount(s.number)+' hafal',COUNTS[s.number-1]+' ayahs · '+hafCount(s.number)+' memorized');
    names.appendChild(b);names.appendChild(sm);
    var ar=document.createElement('span');ar.className='q-ar-name arab';ar.setAttribute('lang','ar');ar.textContent=s.name;
    var hf=document.createElement('span');hf.className='q-haf';hf.textContent=hafCount(s.number)>=COUNTS[s.number-1]?'✔':(hafCount(s.number)+'/'+COUNTS[s.number-1]);
    card.appendChild(num);card.appendChild(names);card.appendChild(ar);card.appendChild(hf);
    function open(){openSurah(s.number);}
    card.addEventListener('click',open);
    card.addEventListener('keydown',function(e){if(e.key==='Enter')open();});
    box.appendChild(card);
  });
  $('qLoading').style.display=rows.length?'none':'block';
  if(!rows.length)$('qLoading').textContent=L('Tidak ada hasil','No results');
  chip();
}
function openSurah(sn){
  curSurah=sn;curAyah=0;
  try{localStorage.setItem(LKEY,String(sn));}catch(e){}
  $('qListView').style.display='none';$('qReaderView').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
  renderReader();
}
function renderReader(){
  var s=null;for(var i=0;i<SURAH.length;i++){if(SURAH[i].number===curSurah)s=SURAH[i];}
  if(!s)return;
  $('qTitleAr').textContent=s.name;
  $('qTitleTr').textContent=L(s.nameId||s.nameEn,s.nameEn||s.nameId);
  $('qMeta').textContent=L('Surah ke-'+s.number+' · '+COUNTS[s.number-1]+' ayat · '+hafCount(s.number)+' hafal','Surah '+s.number+' · '+COUNTS[s.number-1]+' ayahs · '+hafCount(s.number)+' memorized');
  $('qProgFill').style.width=Math.round(100*hafCount(s.number)/COUNTS[s.number-1])+'%';
  $('qBismillah').style.display=(curSurah===9)?'none':'block';
  var box=$('qAyahs');box.innerHTML='';
  s.ayahs.forEach(function(a){
    var card=document.createElement('div');card.className='card q-ayah';card.id='ayah-'+a.n;
    var ar=document.createElement('div');ar.className='ar arab';ar.setAttribute('lang','ar');ar.setAttribute('dir','rtl');ar.textContent=a.text;
    card.appendChild(ar);
    if(showLatin){var lt=document.createElement('div');lt.className='latin';lt.textContent=(latinCache&&latinCache[curSurah]&&latinCache[curSurah][a.n])||L('Transliterasi dimuat saat online…','Transliteration loads when online…');card.appendChild(lt);}
    if(showTrans){
      var tr=document.createElement('div');tr.className='trans';
      var txt=(window.__nyalaLang==='en'&&enCache&&enCache[curSurah]&&enCache[curSurah][a.n])||a.id||'';
      tr.textContent=txt;
      card.appendChild(tr);
    }
    var row=document.createElement('div');row.className='row';
    var n=document.createElement('span');n.className='n';n.textContent=s.number+':'+a.n;
    var play=document.createElement('button');play.className='q-mini';play.textContent='▶ '+L('Murottal','Recite');
    play.addEventListener('click',function(){playAyah(a.n);});
    var hafB=document.createElement('button');hafB.className='q-mini'+(isHaf(curSurah,a.n)?' on':'');
    hafB.textContent=isHaf(curSurah,a.n)?'✔ '+L('Hafal','Memorized'):L('Tandai hafal','Mark memorized');
    hafB.addEventListener('click',function(){setHaf(curSurah,a.n,!isHaf(curSurah,a.n));renderReader();renderList();toast(isHaf(curSurah,a.n)?L('Ditandai hafal ✔','Marked memorized ✔'):L('Tanda hafal dilepas','Memorization mark removed'));});
    row.appendChild(n);row.appendChild(play);row.appendChild(hafB);
    card.appendChild(row);box.appendChild(card);
  });
  chip();
}
function reciterName(){for(var i=0;i<RECITERS.length;i++){if(RECITERS[i].id===reciter)return RECITERS[i].name;}return reciter;}
function paintPlayer(){
  $('qPlayer').classList.add('show');
  $('pPlay').textContent=playing?'⏸':'▶';
  $('pLabel').textContent=fullMode?L('Surah penuh ','Full surah ')+curSurah+' · '+reciterName():L('Qur\'an ','Qur\'an ')+curSurah+':'+curAyah+' · '+reciterName();
}
function markPlaying(){
  document.querySelectorAll('.q-ayah').forEach(function(el){el.classList.remove('playing');});
  var el=$('ayah-'+curAyah);if(el){el.classList.add('playing');el.scrollIntoView({behavior:'smooth',block:'center'});}
}
function startQueue(){
  if(!queue.length){playing=false;paintPlayer();return;}
  var g=queue.shift();
  audio.src='https://cdn.islamic.network/quran/audio/128/'+reciter+'/'+g+'.mp3';
  playing=true;
  audio.play().catch(function(){toast(L('Audio gagal dimuat — cek koneksi','Audio failed to load — check connection'));playing=false;paintPlayer();});
  paintPlayer();markPlaying();
}
function playAyah(an){
  fullMode=false;curAyah=an;queue=[];
  if(an===1&&curSurah!==1&&curSurah!==9)queue.push(gNum(1,1));
  queue.push(gNum(curSurah,an));
  startQueue();
}
function playFull(){
  fullMode=true;queue=[];curAyah=0;
  audio.src='https://cdn.islamic.network/quran/audio-surah/128/'+reciter+'/'+curSurah+'.mp3';
  playing=true;
  audio.play().catch(function(){toast(L('Audio surah gagal dimuat — cek koneksi','Surah audio failed — check connection'));playing=false;});
  paintPlayer();
  document.querySelectorAll('.q-ayah').forEach(function(el){el.classList.remove('playing');});
}
audio.addEventListener('ended',function(){
  if(queue.length){startQueue();return;}
  if(fullMode){playing=false;paintPlayer();toast(L('Surah selesai 🌹','Surah finished 🌹'));return;}
  if(autoNext&&curAyah<COUNTS[curSurah-1]){playAyah(curAyah+1);}
  else{playing=false;paintPlayer();}
});
audio.addEventListener('error',function(){
  if(!playing)return;
  if(queue.length){startQueue();return;}
  toast(L('Audio gagal diputar','Audio failed to play'));playing=false;paintPlayer();
});
function stopAudio(){audio.pause();playing=false;queue=[];fullMode=false;$('qPlayer').classList.remove('show');document.querySelectorAll('.q-ayah').forEach(function(el){el.classList.remove('playing');});}

function bind(){
  var rs=$('qReciter');
  RECITERS.forEach(function(r){var o=document.createElement('option');o.value=r.id;o.textContent=r.name;rs.appendChild(o);});
  rs.value=reciter;
  rs.addEventListener('change',function(){reciter=rs.value;try{localStorage.setItem(QKEY,reciter);}catch(e){}if(playing){if(fullMode)playFull();else if(curAyah)playAyah(curAyah);}else paintPlayer();});
  $('qSearch').addEventListener('input',renderList);
  $('qFilter').addEventListener('change',renderList);
  $('qSort').addEventListener('change',renderList);
  function tog(el,get,set){el.addEventListener('click',function(e){e.preventDefault();var v=!get();set(v);el.classList.toggle('on',v);var inp=el.querySelector('input');if(inp)inp.checked=v;});}
  tog($('qTransToggle'),function(){return showTrans;},function(v){showTrans=v;if(curSurah)renderReader();});
  tog($('qLatinToggle'),function(){return showLatin;},function(v){
    showLatin=v;
    if(v){loadLatin().then(function(m){if(curSurah)renderReader();if(!m)toast(L('Transliterasi butuh koneksi internet','Transliteration needs internet'));});}
    else if(curSurah)renderReader();
  });
  tog($('qAutoToggle'),function(){return autoNext;},function(v){autoNext=v;});
  $('qBack').addEventListener('click',function(){stopAudio();$('qReaderView').style.display='none';$('qListView').style.display='block';renderList();window.scrollTo({top:0,behavior:'smooth'});});
  $('qFull').addEventListener('click',playFull);
  $('qMarkAll').addEventListener('click',function(){for(var i=1;i<=COUNTS[curSurah-1];i++)setHaf(curSurah,i,true);renderReader();renderList();toast(L('Semua ayat ditandai hafal ✔','All ayahs marked memorized ✔'));});
  $('qResetHaf').addEventListener('click',function(){
    undoBuf=JSON.parse(JSON.stringify(haf[curSurah]||{}));
    haf[curSurah]={};saveHaf();renderReader();renderList();
    var t=toast(L('Hafalan surah ini direset — tap untuk undo','This surah\'s memorization reset — tap to undo'));
    if(t){t.style.cursor='pointer';t.addEventListener('click',function(){if(undoBuf){haf[curSurah]=undoBuf;undoBuf=null;saveHaf();renderReader();renderList();toast(L('Dikembalikan ✔','Restored ✔'));}});}
  });
  $('pPlay').addEventListener('click',function(){
    if(playing){audio.pause();playing=false;}
    else{
      playing=true;
      if(queue.length)startQueue();
      else if(fullMode)playFull();
      else if(curAyah)playAyah(curAyah);
      else playAyah(1);
    }
    paintPlayer();
  });
  $('pPrev').addEventListener('click',function(){if(!fullMode&&curAyah>1)playAyah(curAyah-1);});
  $('pNext').addEventListener('click',function(){if(!fullMode&&curAyah<COUNTS[curSurah-1])playAyah(curAyah+1);});
  $('pClose').addEventListener('click',stopAudio);
  $('qResumeBtn').addEventListener('click',function(){var l=0;try{l=parseInt(localStorage.getItem(LKEY)||'0',10);}catch(e){}if(l)openSurah(l);});
  new MutationObserver(function(){if(curSurah)renderReader();renderList();}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
}
function init(){
  bind();
  loadAll().then(function(ar){
    SURAH=ar;renderList();
    var last=0;try{last=parseInt(localStorage.getItem(LKEY)||'0',10);}catch(e){}
    if(last&&SURAH[last-1]){
      $('qResume').hidden=false;
      $('qResumeTxt').textContent=L('Lanjutan bacaan: ','Resume reading: ')+(SURAH[last-1].nameId||SURAH[last-1].nameEn)+' ('+last+')';
      $('qResumeBtn').setAttribute('data-target',last);
      $('qResumeBtn').onclick=function(){openSurah(last);};
    }
    if(window.__nyalaLang==='en'){loadEN().then(function(m){if(!m)toast(L('Terjemahan English belum ada — unggah en.sahih.json atau butuh koneksi','English translation missing — upload en.sahih.json or connect'));});}
  }).catch(function(){$('qLoading').textContent=L('Gagal memuat mushaf — cek koneksi lalu muat ulang','Failed to load mushaf — check connection then reload');});
  new MutationObserver(function(){
    if(window.__nyalaLang==='en'){loadEN().then(function(m){if(curSurah)renderReader();if(!m)toast(L('Terjemahan English belum tersedia — unggah en.sahih.json','English translation unavailable — upload en.sahih.json'));});}
    else if(curSurah)renderReader();
  }).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>
</body>
</html>
